name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0, v1.1.0 等 tag 时触发
  workflow_dispatch: # 允许在 Actions 页面手动触发构建

permissions:
  contents: write # 赋予创建 Release 和上传产物的写入权限

jobs:
  build:
    name: Build and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 获取完整提交历史，以便自动生成变更日志（Release Notes）

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          
          # 清洗分支/Tag名字中的特殊字符（如斜杠），避免文件名非法
          VERSION=$(echo "${{ github.ref_name }}" | tr '/' '-')
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          
          # 1. 拷贝并重命名 Debug APK
          cp app/build/outputs/apk/debug/*-debug.apk release-artifacts/ActionButtonPro-${VERSION}-debug.apk
          
          # 2. 精准拷贝签名插件输出的 Signed APK，彻底避免新旧 Release 文件混淆与覆盖
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} release-artifacts/ActionButtonPro-${VERSION}-release.apk
          
          echo "Renamed Artifacts:"
          ls -lh release-artifacts/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: action-button-pro-apks
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # 优化条件：打 Tag 或者手动触发时（如果是基于某个 tag 触发）都会尝试组装 Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false